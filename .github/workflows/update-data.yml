name: Update DSE data

on:
  schedule:
    # during market hours (Dhaka 10:00-14:30, Sun-Thu): prices every 15 minutes
    - cron: '*/15 4-8 * * 0-4'
    # after market close: full refresh (about 3:30 PM Dhaka time)
    - cron: '30 9 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: "full = everything, prices = prices only"
        default: 'full'
        type: choice
        options: [full, prices]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODE: ${{ github.event.schedule == '30 9 * * 0-4' && 'full' || (github.event_name == 'schedule' && 'prices' || inputs.mode) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch previous data
        run: |
          mkdir -p prev
          git fetch --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:stocks.json > prev/stocks.json || echo "no previous data"

      - name: Fetch DSE data
        run: python scripts/fetch_data.py

      - name: Publish to data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update data ($MODE) $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin data